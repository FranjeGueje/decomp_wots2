# Builds the downloadable packages of the Spanish mod.  Run by hand (Actions → Release →
# Run workflow) it only builds; pushing a tag vX.Y (v1.0, v2.13: no v1.2.3, no suffix)
# on a commit of the espanol branch also publishes them as a release.
#
# Each package is the port plus parchear-espanol, a program that makes the Spanish mod
# from the user's own disc (nothing from the disc is in the package).  The xdelta patch
# for the PS2 disc is made by hand (tools/spanish_iso.py) and added to the release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be vX.Y and on the espanol branch
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Not a tag (manual run): build only."
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y tag (e.g. v1.0)"
            exit 1
          fi
          git fetch --no-tags origin espanol
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$TAG is not on the espanol branch"
            exit 1
          fi

  patcher:
    name: Patcher (${{ matrix.os }})
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            exe: parchear-espanol
            artifact: patcher-linux
            target: linux-x86_64
          - os: windows-2022
            exe: parchear-espanol.exe
            artifact: patcher-windows
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-patcher.txt
      - run: python -m pip install --disable-pip-version-check -r packaging/requirements-patcher.txt
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build-patcher packaging/parchear-espanol.spec
      - name: "Smoke test (no disc: it must refuse without touching anything)"
        shell: bash
        run: |
          set +e
          dist/${{ matrix.exe }} < /dev/null
          rc=$?
          test "$rc" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error
      - name: Package for the release (patcher + translations, for those who already have the port)
        shell: bash
        run: |
          d=wots2-es-parcheador-${{ matrix.target }}
          mkdir -p $d/mods/espanol
          cp dist/${{ matrix.exe }} $d/
          cp mods/espanol/mod.ini $d/mods/espanol/
          find translations/es -type f | xargs cp --parents -t $d
          cp packaging/LEEME-parcheador.txt $d/LEEME.txt
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python -m zipfile -c $d.zip $d
          else
            chmod +x $d/parchear-espanol
            tar czf $d.tar.gz $d
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wots2-es-parcheador-${{ matrix.target }}
          path: wots2-es-parcheador-${{ matrix.target }}.*
          if-no-files-found: error

  linux:
    needs: [tag, patcher]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patcher-linux
          path: patcher
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libgl-dev libarchive-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Package
        run: |
          d=wots2-es-linux-x86_64
          mkdir -p $d/mods
          cp build/wots2 $d/
          strip $d/wots2
          for m in widescreen resolution fps_unlock lighting; do
            mkdir $d/mods/$m
            cp mods/$m/mod.ini mods/$m/$m.so $d/mods/$m/
          done
          cp mods/README.md $d/mods/
          mkdir -p $d/mods/espanol
          cp mods/espanol/mod.ini $d/mods/espanol/
          git ls-files translations/es | xargs cp --parents -t $d
          cp patcher/parchear-espanol $d/
          chmod +x $d/parchear-espanol
          mkdir $d/tools
          cp build/lib/sol/solc build/lib/sol/solrun $d/tools/
          strip $d/tools/*
          cp lib/sol/README.md $d/tools/SOL.md
          cp packaging/README-linux.txt $d/README.txt
          cp packaging/LEEME-espanol.txt $d/LEEME.txt
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: wots2-es-linux-x86_64
          path: wots2-es-linux-x86_64.tar.gz

  windows:
    needs: [tag, patcher]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patcher-windows
          path: patcher
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-libarchive zip
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
      - name: Package
        run: |
          d=wots2-es-windows-x86_64
          mkdir -p $d/mods
          cp build/wots2.exe $d/
          strip $d/wots2.exe
          for m in widescreen resolution fps_unlock lighting; do
            mkdir $d/mods/$m
            cp mods/$m/mod.ini mods/$m/$m.dll $d/mods/$m/
            strip $d/mods/$m/$m.dll
          done
          # The MinGW libraries the program and the mods use (SDL2, libarchive and its own).
          ldd $d/wots2.exe $d/mods/*/*.dll | awk '$3 ~ /^\/mingw64\// {print $3}' | sort -u | xargs -r cp -t $d/
          cp mods/README.md $d/mods/
          mkdir -p $d/mods/espanol
          cp mods/espanol/mod.ini $d/mods/espanol/
          find translations/es -type f | xargs cp --parents -t $d
          cp patcher/parchear-espanol.exe $d/
          mkdir $d/tools
          cp build/lib/sol/solc.exe build/lib/sol/solrun.exe $d/tools/
          strip $d/tools/*.exe
          cp lib/sol/README.md $d/tools/SOL.md
          cp packaging/README-windows.txt $d/README.txt
          cp packaging/LEEME-espanol.txt $d/LEEME.txt
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with:
          name: wots2-es-windows-x86_64
          path: wots2-es-windows-x86_64.zip

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wots2-es-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum wots2-es-* | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wots2-es-*
            SHA256SUMS
          generate_release_notes: true
